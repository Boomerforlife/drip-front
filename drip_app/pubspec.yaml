name: drip
description: "Drip — the outfit-of-the-day social app. Scroll, vibe, save and build fits."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  camera: ^0.12.1
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/themes/
    - assets/brand/
    # Brand logos for the onboarding Labels step: Simple Icons (CC0 set,
    # simpleicons.org), viewBox cropped to the ink. Trademarks of their owners.
    - assets/brands/
    # Occasion photos (Unsplash, free licence; credits in occasions.dart).
    - assets/occasions/

  fonts:
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 300
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Variable.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: Noto Emoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Variable.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf

# Launcher icon: the DRIP wordmark with its brand-red drop (see tool/build_assets.py).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: assets/icon/transparent.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0E1018"
    theme_color: "#0E1018"
